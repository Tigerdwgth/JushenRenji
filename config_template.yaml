# API Keys
llm_api_key: <qwen-key>
dashscope_api_key: <yourkey>

# Directory and File Paths
cache_dir: "./cache"
pic_dir: "./pic"
output_dir: "./output"
font_path: "./font/SIMHEI.TTF"
bilibili_cookies_file: "bilibili_cookies.pkl"

# Bilibili Cookies (从浏览器 DevTools → Application → Cookies 获取)
bilibili_cookies:
  sessdata: "<your_sessdata>"
  bili_jct: "<your_bili_jct>"
  dedeuserid: "<your_userid>"
  dedeuserid_ckmd5: "<your_ckmd5>"
tessdata_prefix: "./font"

# Language Settings
output_language: "zh"  # zh for Chinese, en for English